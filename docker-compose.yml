# Runs the whole app: PostgreSQL, the API, and the web app behind nginx.
#
#   1. Create a .env file next to this one with at least:
#        POSTGRES_PASSWORD=choose-a-strong-password
#      (optional: OPENAI_API_KEY, OPENAI_MODEL, WEB_PORT)
#   2. docker compose up --build
#   3. Open http://localhost:8080 and create the first admin account.
#
# See README "Run with Docker".

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securelens
      POSTGRES_USER: securelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securelens -d securelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://securelens:${POSTGRES_PASSWORD}@db:5432/securelens
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      # The browser reaches the API through nginx on the same origin,
      # so cross-origin requests are not needed.
      CORS_ORIGINS: ""
      AUTO_MIGRATE: "true"
      # Days to keep activity log entries; 0 keeps them forever.
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-0}
    volumes:
      - uploads:/app/uploads
    # No published port: only the web container talks to the API.

  web:
    build: .
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:

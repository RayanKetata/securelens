name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Lets the real-OCR test run instead of being skipped.
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      # Offline suite: temporary SQLite database and mocked OpenAI calls.
      # No secrets are needed or used.
      - name: Run tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker stack on PostgreSQL
    runs-on: ubuntu-latest
    env:
      # Throwaway password for the CI database only.
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      # Builds both images, runs the migrations against PostgreSQL on
      # startup, and waits until every container reports healthy.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check models match migrations on PostgreSQL
        run: docker compose exec -T backend python -m alembic check

      - name: Check the web app and API through nginx
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:8080/systems/1 | grep -q '<div id="root">'
          curl --fail --silent http://localhost:8080/api/health | grep -q '"healthy"'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8080/api/systems)" = 401

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
